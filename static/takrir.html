<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Такрир — WhatsApp Style</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#d1d7db;color:#111b21}
:root{--wa-green:#00a884;--wa-green-dark:#008f72;--wa-light:#f0f2f5;--wa-bg:#efeae2;--wa-muted:#667781}
#loginScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b141a,#182229)}
.login-wrapper{width:min(430px,92vw);background:#fff;border-radius:18px;padding:35px 30px;box-shadow:0 20px 70px rgba(0,0,0,.35);text-align:center}
.google-login-btn{width:100%;border:1px solid #dadce0;background:#fff;color:#202124;padding:14px 18px;border-radius:9px;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.google-login-btn:hover{background:#f8f9fa}
#app{width:100%;height:100vh;display:flex}
.sidebar{width:350px;height:100%;background:#fff;border-right:1px solid #d9d9d9;display:flex;flex-direction:column}
.sidebar-header{height:65px;background:var(--wa-light);display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.profile{display:flex;align-items:center;gap:10px}
.profile-avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#dfe5e7}
.profile-name{font-weight:bold}
.search-area{padding:8px 12px;background:#fff;border-bottom:1px solid #eee;display:flex;gap:8px}
.search-box{flex:1;height:40px;border:0;outline:none;border-radius:8px;background:#f0f2f5;padding:0 15px}
.chat-list{flex:1;overflow-y:auto}
.chat-item{height:72px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.chat-item:hover{background:#f5f6f6}
.chat-avatar{width:48px;height:48px;border-radius:50%;background:#d9fdd3;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#00a884}
.main{flex:1;height:100%;display:flex;flex-direction:column;background:var(--wa-bg)}
.main-header{height:65px;background:var(--wa-light);border-bottom:1px solid #d8d8d8;display:flex;align-items:center;padding:0 18px;gap:12px}
.message-area{flex:1;overflow-y:auto;padding:28px;display:flex;align-items:center;justify-content:center}
.welcome-box{text-align:center;background:#f8f9fa;border-radius:15px;padding:40px;box-shadow:0 1px 3px rgba(0,0,0,.08);color:#667781}
.floating-plus{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border:0;border-radius:50%;background:var(--wa-green);color:#fff;font-size:32px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.28);z-index:9000;display:flex;align-items:center;justify-content:center}
.floating-plus:hover{background:var(--wa-green-dark)}
.modal-overlay{position:fixed;inset:0;z-index:8000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);padding:15px}
.modal{width:min(480px,96vw);background:#fff;border-radius:15px;padding:25px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.modal input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-top:10px;outline:none}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;border:0;border-radius:8px;padding:12px;cursor:pointer}
.btn-green{background:var(--wa-green);color:#fff;font-weight:bold}
.btn-cancel{background:#e5e7eb}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-wrapper">
        <h2>Такрир</h2>
        <p>Google аккаунт менен кириңиз</p>
        <button class="google-login-btn" type="button" onclick="googleLogin()">
            Войти через Google
        </button>
    </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="profile">
                <img id="userAvatar" class="profile-avatar" src="" alt="">
                <div>
                    <div id="userName" class="profile-name">Такрир</div>
                    <div id="userEmail" style="font-size:11px;color:var(--wa-muted)"></div>
                </div>
            </div>
        </div>
        <div class="search-area">
            <input id="searchInput" class="search-box" type="text" placeholder="Издөө..." oninput="renderChatList()">
        </div>
        <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="main">
        <header class="main-header">
            <div id="mainTitle" style="font-weight:bold;font-size:16px">Такрир</div>
        </header>
        <section id="messageArea" class="message-area">
            <div class="welcome-box">
                <h2>Кош келиңиз!</h2>
                <p>Файл кошуу үчүн <b>＋</b> баскычын басыңыз.</p>
            </div>
        </section>
    </main>
</div>

<button class="floating-plus" onclick="openNumberModal()">＋</button>

<!-- NUMBER MODAL -->
<div id="numberModal" class="modal-overlay">
    <div class="modal">
        <h2>Файл каттоо</h2>
        <input id="fileNumberInput" type="text" placeholder="Файл номери (мисалы: 001)">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('numberModal')">Жокко чыгаруу</button>
            <button class="btn-green" onclick="continueNumber()">Улантуу</button>
        </div>
    </div>
</div>

<!-- VIDEO MODAL -->
<div id="videoModal" class="modal-overlay">
    <div class="modal">
        <h2>Видео жүктөө</h2>
        <p id="selectedNumberText"></p>
        <input id="videoInput" type="file" accept="video/*,image/*" style="margin-top:15px">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('videoModal')">Артка</button>
            <button id="registerButton" class="btn-green" disabled onclick="registerVideo()">Каттоо</button>
        </div>
    </div>
</div>

<script>
const GOOGLE_CLIENT_ID = "1070875797774-03j7qfohho2n7f2s2cvjbiqmasi55gue.apps.googleusercontent.com";
const DRIVE_SCOPE = ["openid", "email", "profile", "https://www.googleapis.com/auth/drive"].join(" ");

let currentUser = null, driveAccessToken = null, tokenClient = null;
let selectedFileNumber = "", selectedVideoFile = null;

function loadGoogleIdentity(cb){
    if(window.google && google.accounts) { cb(); return; }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = cb;
    document.head.appendChild(s);
}

function googleLogin(){
    loadGoogleIdentity(() => {
        if(!tokenClient){
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: DRIVE_SCOPE,
                callback: async (res) => {
                    if(res?.access_token){
                        driveAccessToken = res.access_token;
                        await loadUser();
                    }
                }
            });
        }
        tokenClient.requestAccessToken({prompt: "select_account"});
    });
}

async function loadUser(){
    const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer "+driveAccessToken}});
    currentUser = await r.json();
    document.getElementById("userAvatar").src = currentUser.picture || "";
    document.getElementById("userName").textContent = currentUser.name;
    document.getElementById("userEmail").textContent = currentUser.email;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    renderChatList();
}

function getFiles(){
    try { return JSON.parse(localStorage.getItem("takrir_files") || "[]"); } catch(e) { return []; }
}
function saveFiles(f){ localStorage.setItem("takrir_files", JSON.stringify(f)); }

function openNumberModal(){ document.getElementById("numberModal").style.display = "flex"; }
function closeModal(id){ document.getElementById(id).style.display = "none"; }

function continueNumber(){
    const num = document.getElementById("fileNumberInput").value.trim();
    if(!num) return;
    selectedFileNumber = num;
    document.getElementById("selectedNumberText").textContent = "Номер: " + num;
    closeModal("numberModal");
    document.getElementById("videoModal").style.display = "flex";
}

document.getElementById("videoInput").addEventListener("change", function(){
    selectedVideoFile = this.files[0];
    document.getElementById("registerButton").disabled = !selectedVideoFile;
});

async function registerVideo(){
    if(!selectedVideoFile || !selectedFileNumber) return;
    const files = getFiles();
    files.unshift({
        id: "file_" + Date.now(),
        number: selectedFileNumber,
        name: selectedVideoFile.name,
        date: new Date().toLocaleString("ky-KG"),
        url: "#"
    });
    saveFiles(files);
    closeModal("videoModal");
    renderChatList();
}

function renderChatList(){
    const list = document.getElementById("chatList");
    const files = getFiles();
    if(!files.length){ list.innerHTML = '<div style="padding:20px;text-align:center;color:#667781">Файлдар жок</div>'; return; }
    list.innerHTML = files.map(f => `
        <div class="chat-item">
            <div class="chat-avatar">${f.number}</div>
            <div>
                <div style="font-weight:bold">${f.number}</div>
                <div style="font-size:12px;color:#667781">${f.name}</div>
            </div>
        </div>
    `).join("");
}
</script>
</body>
</html>
