<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد استمارة التقرير</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        .btn {
            background: #2563eb;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 25px;
        }

        .file-number-input {
            border: 2px solid #2563eb !important;
            background: #eff6ff !important;
            font-weight: 700;
            direction: ltr;
            text-align: left;
        }

        .photo-help {
            margin-top: 5px;
            color: #64748b;
            font-size: 12px;
        }

        .pdf-list {
            margin-top: 35px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        .pdf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f8fafc;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }

        .local-file-btn {
            border: none;
            background: #2563eb;
            color: #fff;
            padding: 9px 18px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            body { padding: 10px; }
            .container { padding: 18px; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>استمارة تقرير اليتيم</h1>

    <form id="reportForm" enctype="multipart/form-data">
        <div class="form-grid">

            <!-- FILE NUMBER -->
            <div class="form-group full-width">
                <label>رقم الملف (Файл №) - Базага сактоо үчүн</label>
                <input type="text" name="file_number" id="fileNumber" class="file-number-input" placeholder="Мисалы: 00125" required autocomplete="off">
            </div>

            <!-- LINK FOR QR CODE -->
            <div class="form-group full-width">
                <label>رابط الفيديو / الملف (Шилتهме - QR код түзүү үчүн)</label>
                <input type="text" name="link" placeholder="https://...">
            </div>

            <!-- PHOTO 10 -->
            <div class="form-group">
                <label>الصورة الشخصية (Жеке сүрөт - photo10)</label>
                <input type="file" name="photo10" id="photo10" accept="image/*">
                <div class="photo-help">Жүзү автоматтык ортого жайгаштырылат.</div>
            </div>

            <!-- PHOTO 1 -->
            <div class="form-group">
                <label>الصورة 1 (Сүрөт 1)</label>
                <input type="file" name="photo1" accept="image/*">
            </div>

            <!-- PHOTO 2 -->
            <div class="form-group">
                <label>الصورة 2 (Сүрөт 2)</label>
                <input type="file" name="photo2" accept="image/*">
            </div>

            <!-- PHOTO 3 -->
            <div class="form-group">
                <label>الصورة 3 (Сүрөт 3)</label>
                <input type="file" name="photo3" accept="image/*">
            </div>

        </div>

        <button type="submit" class="btn" id="submitBtn">
            إنشاء ملف PDF (PDF даярдоо)
        </button>

        <div id="status" class="status"></div>
    </form>

    <!-- CREATED PDF FILES -->
    <div class="pdf-list">
        <h3>الملفات التي تم إنشاؤها (Даяр болгон PDFтер):</h3>
        <div id="filesContainer">
            {% for pdf in pdfs %}
                <div class="pdf-item">
                    <span>{{ pdf }}</span>
                    <a href="/download/{{ pdf }}" target="_blank" class="local-file-btn" style="text-decoration:none;">تحميل (Жүктөп алуу)</a>
                </div>
            {% else %}
                <div style="color:#64748b; text-align:center; padding:15px;">Азырынча PDF түзүлө элек.</div>
            {% endfor %}
        </div>
    </div>

</div>

<script>
    const form = document.getElementById('reportForm');
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.onsubmit = async (e) => {
        e.preventDefault();

        btn.disabled = true;
        btn.innerText = 'جاري المعالجة... (Даярдалууда...)';
        statusDiv.innerHTML = '';

        const formData = new FormData(form);

        try {
            const res = await fetch('/api/generate', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.ok) {
                statusDiv.innerHTML = `
                    <div style="color:#15803d; background:#f0fdf4; border:1px solid #bbf7d0; padding:10px; border-radius:7px;">
                        ✓ تم إنشاء الملف بنجاح!
                        <br><strong>Файл №: ${data.file_number}</strong>
                        <br><a href="${data.download}" target="_blank" style="color:#15803d; font-weight:700;">اضغط هنا لتحميل الملف</a>
                    </div>
                `;
                form.reset();
                setTimeout(() => location.reload(), 1800);
            } else {
                statusDiv.innerHTML = `<div style="color:#dc2626; background:#fef2f2; border:1px solid #fecaca; padding:10px; border-radius:7px;">✕ Ката: ${data.error}</div>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<div style="color:#dc2626; background:#fef2f2; border:1px solid #fecaca; padding:10px; border-radius:7px;">✕ Сервер катасы.</div>`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'إنشاء ملف PDF (PDF даярдоо)';
        }
    };
</script>

</body>
</html>
