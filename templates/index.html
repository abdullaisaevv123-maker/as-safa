<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد استمارة التقرير</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        .btn {
            background: #2563eb;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 25px;
        }

        .file-number-input {
            border: 2px solid #2563eb !important;
            background: #eff6ff !important;
            font-weight: 700;
            direction: ltr;
            text-align: left;
        }

        .photo-help {
            margin-top: 5px;
            color: #64748b;
            font-size: 12px;
        }

        .pdf-list {
            margin-top: 35px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        .pdf-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pdf-list-header h3 {
            margin: 0;
        }

        .pdf-count-badge {
            background: #eff6ff;
            color: #1e3a8a;
            border: 1px solid #bfdbfe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .pdf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .pdf-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            direction: ltr;
            text-align: left;
        }

        .pdf-name {
            font-weight: 700;
            font-size: 14px;
            color: #1e293b;
            word-break: break-all;
        }

        .pdf-meta {
            font-size: 12px;
            color: #64748b;
        }

        .pdf-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .local-file-btn {
            border: none;
            background: #2563eb;
            color: #fff;
            padding: 8px 15px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .local-file-btn:hover {
            background: #1d4ed8;
        }

        .delete-file-btn {
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #dc2626;
            padding: 8px 13px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .delete-file-btn:hover {
            background: #fee2e2;
        }

        .scroll-loader {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            padding: 14px;
        }

        @media (max-width: 700px) {
            body { padding: 10px; }
            .container { padding: 18px; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .pdf-item { flex-direction: column; align-items: stretch; }
            .pdf-actions { justify-content: flex-end; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>استمارة تقرير اليتيم</h1>

    <form id="reportForm" enctype="multipart/form-data">
        <div class="form-grid">

            <!-- FILE NUMBER -->
            <div class="form-group full-width">
                <label>رقم الملف (Файл №) - Базага сактоо үчүн</label>
                <input type="text" name="file_number" id="fileNumber" class="file-number-input" placeholder="Мисалы: 00125" required autocomplete="off">
            </div>

            <!-- LINK FOR QR CODE -->
            <div class="form-group full-width">
                <label>رابط الفيديو / الملف (Шилتهме - QR код түзүү үчүн)</label>
                <input type="text" name="link" placeholder="https://...">
            </div>

            <!-- PHOTO 10 -->
            <div class="form-group">
                <label>الصورة الشخصية (Жеке сүрөт - photo10)</label>
                <input type="file" name="photo10" id="photo10" accept="image/*">
                <div class="photo-help">Жүзү автоматтык ортого жайгаштырылат.</div>
            </div>

            <!-- PHOTO 1 -->
            <div class="form-group">
                <label>الصورة 1 (Сүрөт 1)</label>
                <input type="file" name="photo1" accept="image/*">
            </div>

            <!-- PHOTO 2 -->
            <div class="form-group">
                <label>الصورة 2 (Сүрөт 2)</label>
                <input type="file" name="photo2" accept="image/*">
            </div>

            <!-- PHOTO 3 -->
            <div class="form-group">
                <label>الصورة 3 (Сүрөт 3)</label>
                <input type="file" name="photo3" accept="image/*">
            </div>

        </div>

        <button type="submit" class="btn" id="submitBtn">
            إنشاء ملف PDF (PDF даярдоо)
        </button>

        <div id="status" class="status"></div>
    </form>

    <!-- CREATED PDF FILES -->
    <div class="pdf-list">
        <div class="pdf-list-header">
            <h3>الملفات التي تم إنشاؤها (Даяр болгон PDFтер):</h3>
            <span id="totalBadge" class="pdf-count-badge">0</span>
        </div>

        <div id="filesContainer"></div>
        <div id="scrollSentinel" class="scroll-loader">Жүктөлүүдө...</div>
    </div>

</div>

<script>
    const form = document.getElementById('reportForm');
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('submitBtn');
    const filesContainer = document.getElementById('filesContainer');
    const scrollSentinel = document.getElementById('scrollSentinel');
    const totalBadge = document.getElementById('totalBadge');

    let offset = 0;
    const LIMIT = 10;
    let isLoading = false;
    let hasMore = true;

    function createPdfCard(item) {
        const div = document.createElement('div');
        div.className = 'pdf-item';
        div.dataset.id = item.id;

        const createdDate = item.created_at ? item.created_at.replace('T', ' ') : '';

        div.innerHTML = `
            <div class="pdf-info">
                <span class="pdf-name">${item.name}</span>
                <span class="pdf-meta">Файл №: ${item.file_number} ${createdDate ? '• ' + createdDate : ''}</span>
            </div>
            <div class="pdf-actions">
                <a href="${item.url}" target="_blank" class="local-file-btn">تحميل (Жүктөп алуу)</a>
                <button type="button" class="delete-file-btn" onclick="deletePdfItem(${item.id}, this)">حذف (Удалить)</button>
            </div>
        `;
        return div;
    }

    async function loadMorePdfs(reset = false) {
        if (isLoading) return;
        if (reset) {
            offset = 0;
            hasMore = true;
            filesContainer.innerHTML = '';
        }
        if (!hasMore) return;

        isLoading = true;
        scrollSentinel.style.display = 'block';
        scrollSentinel.innerText = 'Жүктөлүүдө...';

        try {
            const res = await fetch(`/api/pdfs?offset=${offset}&limit=${LIMIT}`);
            const data = await res.json();

            if (data.ok) {
                totalBadge.innerText = `Баары: ${data.total}`;

                if (data.items.length === 0 && offset === 0) {
                    filesContainer.innerHTML = '<div id="emptyMsg" style="color:#64748b; text-align:center; padding:15px;">Азырынча PDF түзүлө элек.</div>';
                    hasMore = false;
                    scrollSentinel.style.display = 'none';
                } else {
                    const emptyMsg = document.getElementById('emptyMsg');
                    if (emptyMsg) emptyMsg.remove();

                    data.items.forEach(item => {
                        filesContainer.appendChild(createPdfCard(item));
                    });

                    offset += data.items.length;
                    hasMore = data.has_more;

                    if (hasMore) {
                        scrollSentinel.innerText = 'Дагы жүктөө үчүн ылдый жылдырыңыз...';
                    } else {
                        scrollSentinel.innerText = 'Бардык файлдар көрсөтүлдү.';
                    }
                }
            }
        } catch (err) {
            scrollSentinel.innerText = 'Тизмени жүктөөдө ката кетти.';
        } finally {
            isLoading = false;
        }
    }

    async function deletePdfItem(id, buttonEl) {
        if (!confirm('Бул PDFти сайттын тизмесинен өчүрөсүзбү? (Cloudinary булутунда сакталып кала берет)')) {
            return;
        }

        buttonEl.disabled = true;
        buttonEl.innerText = 'Өчүрүлүүдө...';

        try {
            const res = await fetch(`/api/pdfs/${id}`, { method: 'DELETE' });
            const data = await res.json();

            if (data.ok) {
                const card = buttonEl.closest('.pdf-item');
                if (card) card.remove();
                offset = Math.max(0, offset - 1);

                // Эгер баары өчүрүлсө
                if (filesContainer.children.length === 0) {
                    loadMorePdfs(true);
                } else {
                    // Жалпы санды 1ге азайтуу
                    const currentTotal = parseInt(totalBadge.innerText.replace(/\D/g, ''), 10) || 1;
                    totalBadge.innerText = `Баары: ${Math.max(0, currentTotal - 1)}`;
                }
            } else {
                alert('Ката: ' + (data.error || 'Өчүрүлгөн жок'));
                buttonEl.disabled = false;
                buttonEl.innerText = 'حذف (Удалить)';
            }
        } catch (err) {
            alert('Сервер катасы.');
            buttonEl.disabled = false;
            buttonEl.innerText = 'حذف (Удалить)';
        }
    }

    // Ылдый жылдырганда (Infinite Scroll) автоматтык 10дон жүктөө
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && hasMore && !isLoading) {
            loadMorePdfs(false);
        }
    }, { rootMargin: '150px' });

    observer.observe(scrollSentinel);

    // Барак ачылганда биринчи 10 PDFти жүктөө
    loadMorePdfs(true);

    // Форманы жөнөтүү
    form.onsubmit = async (e) => {
        e.preventDefault();

        btn.disabled = true;
        btn.innerText = 'جاري المعالجة... (Даярдалууда...)';
        statusDiv.innerHTML = '';

        const formData = new FormData(form);

        try {
            const res = await fetch('/api/generate', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.ok) {
                statusDiv.innerHTML = `
                    <div style="color:#15803d; background:#f0fdf4; border:1px solid #bbf7d0; padding:10px; border-radius:7px;">
                        ✓ تم إنشاء الملف بنجاح!
                        <br><strong>Файл №: ${data.file_number}</strong>
                        <br><a href="${data.download}" target="_blank" style="color:#15803d; font-weight:700;">اضغط هنا لتحميل الملف</a>
                    </div>
                `;
                form.reset();
                // Тизмени жаңылоо (жаңы кошулган PDF эң башына чыгат)
                loadMorePdfs(true);
            } else {
                statusDiv.innerHTML = `<div style="color:#dc2626; background:#fef2f2; border:1px solid #fecaca; padding:10px; border-radius:7px;">✕ Ката: ${data.error}</div>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<div style="color:#dc2626; background:#fef2f2; border:1px solid #fecaca; padding:10px; border-radius:7px;">✕ Сервер катасы.</div>`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'إنشاء ملف PDF (PDF даярдоо)';
        }
    };
</script>

</body>
</html>
