<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد استمارة التقرير</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* КАТЕГОРИЯ ТАБДАРЫ */
        .category-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .tab-btn {
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: #475569;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .tab-btn.active-armala {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
        }

        .tab-btn.active-siroty {
            background: #059669;
            color: #fff;
            box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 22px;
            font-size: 23px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #4b5563;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        .btn {
            background: #2563eb;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn:hover {
            opacity: 0.93;
        }

        .btn-siroty {
            background: #059669;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 25px;
        }

        .file-number-input {
            border: 2px solid #2563eb !important;
            background: #eff6ff !important;
            font-weight: 700;
            direction: ltr;
            text-align: left;
        }

        .photo-help {
            margin-top: 5px;
            color: #64748b;
            font-size: 12px;
        }

        /* PDF ТИЗМЕСИ ЖАНА ТОБУ МЕНЕН БАШКАРУУ */
        .pdf-list {
            margin-top: 35px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        .pdf-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pdf-list-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .pdf-count-badge {
            background: #eff6ff;
            color: #1e3a8a;
            border: 1px solid #bfdbfe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .search-bar-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-bar-box input {
            flex: 1;
            direction: ltr;
            text-align: left;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
        }

        .clear-search-btn {
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #475569;
            padding: 0 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        /* ТАНДОО ЖАНА БААРЫН ӨЧҮРҮҮ ПАНЕЛИ */
        .bulk-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 9px 14px;
            border-radius: 9px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .bulk-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .select-all-btn {
            border: 1.5px solid #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
            padding: 6px 14px;
            border-radius: 7px;
            font-size: 13px;
